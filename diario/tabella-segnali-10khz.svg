<h2 id="osservazioni">Osservazioni</h2>
<ul>
<li>Il centroide del noise scende da ~24000 a ~5000 Hz, piu’
confrontabile con i segnali tonali</li>
<li>La transizione nel mix sin/noise diventa piu’ graduale: 0.20 -&gt;
0.74 -&gt; 0.89 -&gt; 0.94 (prima: 0.31 -&gt; 0.91 -&gt; 0.94)</li>
<li>Flux e irregularity del noise si riducono (~80%) per il minor numero
di bin considerate</li>
<li>I segnali tonali (sinusoidi, FM, tanh, glissandi) restano
praticamente invariati: il loro contenuto era gia’ sotto 10 kHz</li>
<li>La tanh drive 20 mostra flatness leggermente piu’ alta (0.39 vs
0.33): le armoniche sopra 10 kHz non diluiscono piu’ il calcolo</li>
<li>Il limite rende i descrittori piu’ sensibili alla zona musicalmente
rilevante</li>
</ul>
